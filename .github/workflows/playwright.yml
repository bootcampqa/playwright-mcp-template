name: Playwright Tests

on:
  # 1. Ejecución solo al hacer push (se eliminó pull_request)
  push:
    branches: [ main, master ]

  # 2. Permite lanzar el workflow manualmente desde GitHub Actions
  workflow_dispatch:

  # 3. Programado para ejecutarse una vez a la semana (Todos los lunes a las 08:00 AM UTC)
  schedule:
    - cron: '0 8 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Configurar Node.js y activar la caché de npm (node_modules)
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: 'npm'

    # Instalar dependencias exactas según package-lock.json
    - name: Install dependencies
      run: npm ci

    # Caché de navegadores de Playwright basada en package-lock.json
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    # Instalar navegadores únicamente si NO estaban en la caché
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    # Si hubo acierto de caché, instalar solo dependencias de SO requeridas
    - name: Install Playwright System Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    # Ejecutar tests
    - name: Run Playwright tests (Web + Mobile)
      run: npx playwright test

    # Generar y subir reporte en caso de éxito o fallo
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30